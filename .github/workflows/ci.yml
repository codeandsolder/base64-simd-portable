name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
    with:
      strict-suites: |
        [{"name":"workspace","allow-test-panics":true}]
      rust-targets: wasm32-unknown-unknown
      command: |
        cargo test --locked --workspace
        cargo test --locked --workspace --release
        cargo check --locked --lib --target wasm32-unknown-unknown
        cargo --config 'target.wasm32-unknown-unknown.rustflags=["-C","target-feature=+simd128"]' check --locked --lib --target wasm32-unknown-unknown

  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [tests]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["tests","success"]]
